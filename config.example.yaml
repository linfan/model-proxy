# ─── Server settings ───────────────────────────────────────────────
server:
  # Port to listen on (default: 8000, overridden by --port CLI flag)
  port: 8000

  # URL prefix for all routes (e.g. "/api" → /api/v1/chat/completions)
  # Leave empty for no prefix
  url_prefix: ""

  # Enable debug logging (overridden by --debug CLI flag)
  debug: false

# ─── Request/response recording ───────────────────────────────────
record:
  # Directory to store recorded request/response JSON files
  # Supports ~ for home directory
  path: ~/.model-proxy/records

  # Maximum number of record groups to keep (oldest are cleaned up)
  # Set to 0 to disable recording entirely
  max_count: 1000

# ─── Backend model definitions ────────────────────────────────────
# Models are grouped by backend type. Each model entry maps a local
# model name (used by clients) to a remote API endpoint.
#
# Clients send requests using the local model name. The proxy
# replaces it with the remote model name and forwards to the
# configured URL.
#
# Both /v1/chat/completions (OpenAI format) and /v1/messages
# (Anthropic format) endpoints are exposed. When a client hits
# an endpoint whose format doesn't match the backend type, the
# proxy automatically converts between formats.

backends:
  # ── OpenAI-compatible backends ────────────────────────────────
  openai:
    - name: gpt-4o             # Local model name (what clients send)
      url: https://api.openai.com/v1/chat/completions
      api_token: sk-xxx         # Bearer token for Authorization header
      model: gpt-4o             # Remote model name sent to the API
      system_prompt: ""         # Optional: injected as first system message

    - name: qwen
      # DashScope OpenAI-compatible mode (compatibility path)
      url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      api_token: sk-xxx
      model: qwen-plus
      # system_prompt is optional; omit or set to "" to skip injection

    - name: deepseek
      url: https://api.deepseek.com/v1/chat/completions
      api_token: sk-xxx
      model: deepseek-chat
      thinking:
        enabled: true           # Parse <think>...</think> tags in streaming
                                # responses and convert to reasoning_content.
                                # Set to false to pass content through raw.
        # budget_tokens is ignored for OpenAI backends (only used by Anthropic)

    - name: o3-mini
      url: https://api.openai.com/v1/chat/completions
      api_token: sk-xxx
      model: o3-mini
      thinking:
        enabled: false          # No <think> tag parsing needed for this model

  # ── Anthropic backends ────────────────────────────────────────
  anthropic:
    - name: claude-sonnet
      url: https://api.anthropic.com/v1/messages
      api_token: sk-ant-xxx     # Used as x-api-key header
      model: claude-sonnet-4-20250514
      system_prompt: ""
      thinking:                 # Default thinking injected when client omits it
        enabled: true           # Inject thinking: {type: enabled} by default
        budget_tokens: 10000    # Default budget_tokens value

    - name: claude-haiku
      url: https://api.anthropic.com/v1/messages
      api_token: sk-ant-xxx
      model: claude-haiku-4-5-20251001
      # thinking is optional; omit to not inject thinking by default.
      # Clients can always send their own thinking field per the
      # Anthropic API spec — it passes through as-is.

    - name: claude-opus
      url: https://api.anthropic.com/v1/messages
      api_token: sk-ant-xxx
      model: claude-opus-4-20250514
      thinking:
        enabled: false          # Don't inject thinking by default
        budget_tokens: 16000    # Budget used if enabled is set to true

  # ── DashScope native API backends ─────────────────────────────
  # Use these for Alibaba Model Studio's native (non-OpenAI) format.
  # The proxy converts client requests to the DashScope envelope
  # (input.messages + parameters) and converts responses back.
  #
  # Endpoint URL differs by region and model type:
  #   China (Beijing):    https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  #   International:      https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  #   Multimodal models:  .../services/aigc/multimodal-generation/generation
  dashscope:
    - name: qwen-native
      url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
      api_token: sk-xxx
      model: qwen-plus
      system_prompt: ""
      thinking:
        enabled: false          # Maps to parameters.enable_thinking
        budget_tokens: 8192     # Maps to parameters.thinking_budget

    - name: qwen3-thinking
      url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
      api_token: sk-xxx
      model: qwen3-235b-a22b
      thinking:
        enabled: true           # reasoning_content is returned in responses
        budget_tokens: 16384
